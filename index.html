<!DOCTYPE html>
<html>
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silsilah Keluarga</title>
  <style>
    :root{--navy:#152238;--blue:#3867d6;--blue2:#eaf0ff;--bg:#f4f7fb;--ink:#1f2937;--muted:#667085;--line:#e4e9f1;--white:#fff;--green:#198754;--red:#c0392b;--shadow:0 10px 30px rgba(20,35,60,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#17263e,#3159a7)}
    .login-card{width:min(430px,100%);background:white;border-radius:22px;padding:32px;box-shadow:0 20px 60px #07132955}.logo{width:56px;height:56px;border-radius:16px;background:var(--blue2);display:grid;place-items:center;font-size:27px;margin-bottom:16px}.login-card h1{margin:0 0 8px;font-size:26px}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#475467}.field input,.field select,.field textarea{width:100%;border:1px solid #d7deea;border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3867d61c}
    .btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#edf1f7;color:#344054}.btn.danger{background:#fff0ef;color:#b42318}.btn.small{font-size:12px;padding:7px 10px}.btn.block{width:100%;padding:12px}.error{color:#b42318;background:#fff0ef;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}
    .app{min-height:100vh;display:flex}.sidebar{width:245px;background:var(--navy);color:#e7edf8;padding:22px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 25px;font-weight:800;font-size:17px}.brand-icon{width:38px;height:38px;border-radius:12px;background:#3159a7;display:grid;place-items:center}.nav-label{font-size:10px;color:#9ba9c2;text-transform:uppercase;letter-spacing:1.4px;padding:12px 12px 8px}.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#cbd5e5;padding:11px 12px;border-radius:10px;text-align:left;margin:2px 0}.nav-btn.active,.nav-btn:hover{background:#2a3c58;color:#fff}.sidebar-bottom{margin-top:25px;border-top:1px solid #34445d;padding-top:14px}.main{min-width:0;flex:1}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:12px}.topbar h2{font-size:18px;margin:0}.user-pill{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e5ebfb;color:#244ca8;display:grid;place-items:center;font-weight:800}.content{padding:26px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.page-head h1{font-size:25px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:36px;height:36px;border-radius:11px;background:var(--blue2);display:grid;place-items:center}.stat-num{font-size:28px;font-weight:800;margin-top:12px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.panel h3{margin:0;font-size:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f5;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#667085;background:#f9fafb}tr:last-child td{border-bottom:0}.member-name{font-weight:700}.search-row{display:flex;gap:9px;flex-wrap:wrap}.search-row input,.search-row select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-width:180px}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;background:#edf2ff;color:#3559a7}.badge.green{background:#e5f7ec;color:#177245}.badge.gray{background:#f0f2f5;color:#475467}.empty{text-align:center;color:var(--muted);padding:28px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.form-grid .full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap}.modal-backdrop{position:fixed;inset:0;background:#10182880;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:white;border-radius:18px;width:min(780px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 25px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f2f4f7;border-radius:9px;width:34px;height:34px;font-size:20px}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#17263e;color:white;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 40px));font-size:13px}.tree-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tree-viewport{height:65vh;min-height:400px;overflow:auto;background:#f8faff;border:1px dashed #cdd7ea;border-radius:14px;padding:25px;position:relative}.tree-canvas{transform-origin:top left;display:inline-block;min-width:100%;padding:15px;transition:transform .15s}.tree-level{display:flex;justify-content:center;gap:28px;align-items:flex-start;margin:12px 0 0;position:relative}.tree-node{display:flex;flex-direction:column;align-items:center;min-width:170px;max-width:210px;position:relative}.node-card{width:170px;min-height:90px;background:white;border:1px solid #d8e1f1;border-top:4px solid #3867d6;border-radius:13px;padding:10px;text-align:center;box-shadow:0 5px 15px #1c37600c;cursor:pointer}.node-card.female{border-top-color:#bd69a6}.node-card .photo{width:36px;height:36px;object-fit:cover;border-radius:50%;margin-bottom:5px;background:#edf1f7}.node-card .node-name{font-size:12px;font-weight:800;overflow-wrap:anywhere}.node-card .node-sub{font-size:10px;color:var(--muted);margin-top:3px}.tree-children{display:flex;justify-content:center;gap:22px;padding-top:25px;position:relative}.tree-children:before{content:"";position:absolute;top:0;left:50%;height:13px;border-left:1px solid #a9b8d0}.tree-children .tree-node:before{content:"";position:absolute;top:-13px;height:13px;border-left:1px solid #a9b8d0}.tree-level>.tree-node>.tree-children{border-top:1px solid #a9b8d0}.tree-children .tree-node{margin-top:0}.tree-note{font-size:12px;color:var(--muted);margin-top:12px}.family-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.family-card{border:1px solid var(--line);border-radius:13px;padding:15px}.family-card h4{margin:0 0 6px}.family-card p{font-size:12px;color:var(--muted);margin:4px 0}.mobile-menu{display:none}.photo-preview{max-width:90px;max-height:90px;object-fit:cover;border-radius:12px}.login-hint{font-size:12px;margin-top:16px;line-height:1.5}
    @media(max-width:950px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.family-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}}
    @media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:15;left:-260px;top:0;bottom:0;width:245px;transition:left .2s;box-shadow:10px 0 30px #0002}.sidebar.open{left:0}.topbar{height:62px;padding:0 15px}.mobile-menu{display:inline-flex}.topbar h2{font-size:16px}.content{padding:16px}.stats{gap:10px}.stat{padding:14px}.stat-num{font-size:24px}.stat-top{font-size:11px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.family-grid{grid-template-columns:1fr}.tree-viewport{height:60vh;padding:12px}.tree-node{min-width:145px}.node-card{width:145px}.panel{padding:15px}.page-head h1{font-size:22px}.user-pill .user-meta{display:none}}
    @media print{body{background:#fff}.sidebar,.topbar,.no-print,.btn,.search-row,.tree-tools{display:none!important}.main{width:100%}.content{padding:0;max-width:none}.panel,.stat{box-shadow:none;border:0}.tree-viewport{height:auto;overflow:visible;border:0}.tree-canvas{transform:none!important}.node-card{break-inside:avoid}table{min-width:0}th,td{font-size:10px;padding:6px}}
  </style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">🌳</div>
    <h1>Silsilah Keluarga</h1>
    <p class="muted" style="margin-top:0">Simpan cerita dan hubungan keluarga lintas generasi.</p>
    <form id="loginForm">
      <div class="field"><label>Username</label><input id="loginUsername" autocomplete="username" required placeholder="Masukkan username"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Masukkan password"></div>
      <label style="font-size:12px;display:flex;gap:8px;align-items:center;margin:8px 0 16px"><input id="showPassword" type="checkbox" style="width:auto"> Tampilkan password</label>
      <button class="btn block" id="loginBtn" type="submit">Masuk ke aplikasi</button>
      <div id="loginError" class="error hidden"></div>
    </form>
    <div class="login-hint muted">Akses dibatasi untuk pengguna yang diberi akun. Untuk keamanan, ubah password awal setelah login pertama.</div>
  </div>
</div>

<div id="appScreen" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-icon">🌳</div><span>Silsilah Keluarga</span></div>
    <div class="nav-label">Menu utama</div>
    <button class="nav-btn active" data-page="dashboard">▦ <span>Dashboard</span></button>
    <button class="nav-btn" data-page="members">♙ <span>Data Anggota</span></button>
    <button class="nav-btn" data-page="tree">⌘ <span>Pohon Silsilah</span></button>
    <button class="nav-btn" data-page="families">♧ <span>Cabang Keluarga</span></button>
    <button class="nav-btn" data-page="reports">▤ <span>Cetak & Laporan</span></button>
    <div id="adminNav">
      <div class="nav-label">Administrasi</div>
      <button class="nav-btn" data-page="users">♙ <span>Pengguna</span></button>
      <button class="nav-btn" data-page="logs">◷ <span>Log Aktivitas</span></button>
    </div>
    <div class="sidebar-bottom"><button class="nav-btn" data-page="password">⚙ <span>Ganti Password</span></button><button class="nav-btn" id="logoutBtn">↪ <span>Keluar</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px"><button class="btn secondary mobile-menu" id="mobileMenu">☰</button><h2 id="topTitle">Dashboard</h2></div>
      <div class="user-pill"><div class="avatar" id="userAvatar">A</div><div class="user-meta"><b id="userName">Administrator</b><div class="muted" id="userRole">Admin</div></div></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>

<script>
const state = {token:'',user:null,members:[],families:[],stats:{},page:'dashboard',treeScale:1,treeFocus:''};
const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function callServer(action,...args){
  const response = await fetch('/api/gas', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({action, args})
  });
  let result;
  try { result = await response.json(); } catch (_) { throw new Error('Respons server tidak valid. Periksa konfigurasi API Vercel dan Apps Script.'); }
  if (!response.ok || result.ok === false) throw new Error(result.error || 'Permintaan gagal.');
  return Object.prototype.hasOwnProperty.call(result, 'data') ? result.data : result;
}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500);}
function errBox(message){return `<div class="error">${esc(message)}</div>`;}
function memberName(id){const m=state.members.find(x=>String(x.member_id)===String(id));return m?m.nama_lengkap:'—';}
function optionsMembers(selected='',exclude=''){return `<option value="">— Tidak dipilih —</option>`+state.members.filter(m=>String(m.member_id)!==String(exclude)).sort((a,b)=>String(a.nama_lengkap).localeCompare(String(b.nama_lengkap))).map(m=>`<option value="${esc(m.member_id)}" ${String(m.member_id)===String(selected)?'selected':''}>${esc(m.nama_lengkap)}</option>`).join('');}
function optionsFamilies(selected=''){return `<option value="">— Tidak dipilih —</option>`+state.families.map(f=>`<option value="${esc(f.family_group_id)}" ${String(f.family_group_id)===String(selected)?'selected':''}>${esc(f.nama_keluarga)}</option>`).join('');}
async function refreshData(){const d=await callServer('getInitialData',state.token);state.user=d.user;state.members=d.members||[];state.families=d.families||[];state.stats=d.stats||{};renderPage();}
function showApp(user){state.user=user;$('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('userName').textContent=user.display_name||user.username;$('userRole').textContent=user.role;$('userAvatar').textContent=(user.display_name||user.username||'U').charAt(0).toUpperCase();$('adminNav').classList.toggle('hidden',user.role!=='Admin');refreshData().catch(e=>toast(e.message));}
$('showPassword').addEventListener('change',()=>{$('loginPassword').type=$('showPassword').checked?'text':'password';});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginBtn').textContent='Memeriksa...';$('loginError').classList.add('hidden');try{const r=await callServer('login',$('loginUsername').value,$('loginPassword').value);state.token=r.token;showApp(r.user);}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden');}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Masuk ke aplikasi';}});
$('logoutBtn').addEventListener('click',async()=>{try{await callServer('logout',state.token);}catch(e){}state.token='';state.user=null;$('appScreen').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginPassword').value='';});
$('mobileMenu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;$('sidebar').classList.remove('open');document.querySelectorAll('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x===b));renderPage();}));
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions no-print">${actions}</div></div>`;}
function renderPage(){const titles={dashboard:'Dashboard',members:'Data Anggota',tree:'Pohon Silsilah',families:'Cabang Keluarga',reports:'Cetak & Laporan',users:'Pengguna',logs:'Log Aktivitas',password:'Ganti Password'};$('topTitle').textContent=titles[state.page]||'Silsilah Keluarga';const fn={dashboard:renderDashboard,members:renderMembers,tree:renderTree,families:renderFamilies,reports:renderReports,users:renderUsers,logs:renderLogs,password:renderPassword};(fn[state.page]||renderDashboard)();}
function renderDashboard(){const s=state.stats; $('content').innerHTML=pageHead('Dashboard','Ringkasan data dan hubungan keluarga.','<button class="btn" onclick="openMemberForm()">＋ Tambah Anggota</button>')+`
<div class="stats">
<div class="stat"><div class="stat-top">Total Anggota <span class="stat-icon">♙</span></div><div class="stat-num">${s.total||0}</div></div>
<div class="stat"><div class="stat-top">Laki-laki <span class="stat-icon">♂</span></div><div class="stat-num">${s.male||0}</div></div>
<div class="stat"><div class="stat-top">Perempuan <span class="stat-icon">♀</span></div><div class="stat-num">${s.female||0}</div></div>
<div class="stat"><div class="stat-top">Cabang Keluarga <span class="stat-icon">♧</span></div><div class="stat-num">${s.families||0}</div></div>
<div class="stat"><div class="stat-top">Masih Hidup <span class="stat-icon">♡</span></div><div class="stat-num">${s.living||0}</div></div>
<div class="stat"><div class="stat-top">Telah Meninggal <span class="stat-icon">✦</span></div><div class="stat-num">${s.deceased||0}</div></div>
<div class="stat"><div class="stat-top">Generasi Terdata <span class="stat-icon">⌘</span></div><div class="stat-num">${s.generations||0}</div></div>
<div class="stat"><div class="stat-top">Relasi Orang Tua <span class="stat-icon">↳</span></div><div class="stat-num">${state.members.filter(m=>m.father_id||m.mother_id).length}</div></div>
</div>
<div class="panel"><div class="panel-head"><h3>Anggota keluarga terbaru</h3><button class="btn secondary small" onclick="goPage('members')">Lihat semua</button></div>${memberTable(state.members.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,6),false)}</div>
<div class="panel"><h3>Mulai menggunakan aplikasi</h3><p class="muted" style="font-size:13px;line-height:1.7">Tambahkan data anggota, tentukan ID ayah dan ibu, lalu buka menu <b>Pohon Silsilah</b>. Diagram dibentuk dari relasi orang tua yang disimpan di database. Untuk hasil terbaik, isi ID leluhur terlebih dahulu.</p></div>`;}
function goPage(p){state.page=p;document.querySelectorAll('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderPage();}
function memberTable(items,actions=true){if(!items.length)return '<div class="empty">Belum ada data anggota keluarga.</div>';return `<div class="table-wrap"><table><thead><tr><th>Nama anggota</th><th>Jenis kelamin</th><th>Tahun lahir</th><th>Ayah</th><th>Ibu</th><th>Status</th>${actions?'<th>Aksi</th>':''}</tr></thead><tbody>${items.map(m=>`<tr><td><div class="member-name">${esc(m.nama_lengkap)}</div><div class="muted" style="font-size:11px">${esc(m.nama_panggilan||m.member_id)}</div></td><td>${esc(m.jenis_kelamin||'—')}</td><td>${esc(yearOf(m.tanggal_lahir)||'—')}</td><td>${esc(memberName(m.father_id))}</td><td>${esc(memberName(m.mother_id))}</td><td><span class="badge ${m.status_hidup==='Meninggal'?'gray':'green'}">${esc(m.status_hidup||'Hidup')}</span></td>${actions?`<td><div class="actions"><button class="btn secondary small" onclick="openMemberForm('${esc(m.member_id)}')">Edit</button><button class="btn danger small" onclick="deleteMemberUi('${esc(m.member_id)}')">Hapus</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function yearOf(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v).slice(0,4):d.getFullYear();}
function renderMembers(){const canEdit=state.user.role==='Admin';$('content').innerHTML=pageHead('Data Anggota','Kelola biodata dan relasi antaranggota.',canEdit?'<button class="btn" onclick="openMemberForm()">＋ Tambah Anggota</button>':'')+`<div class="panel"><div class="panel-head"><h3>Daftar anggota (${state.members.length})</h3><div class="search-row"><input id="memberSearch" placeholder="Cari nama atau ID..." oninput="filterMembers()"><select id="genderFilter" onchange="filterMembers()"><option value="">Semua jenis kelamin</option><option>Laki-laki</option><option>Perempuan</option></select><select id="statusFilter" onchange="filterMembers()"><option value="">Semua status</option><option>Hidup</option><option>Meninggal</option></select></div></div><div id="memberTable">${memberTable(state.members,canEdit)}</div></div>`;}
function filterMembers(){const q=($('memberSearch')?.value||'').toLowerCase(),g=$('genderFilter')?.value||'',s=$('statusFilter')?.value||'';const items=state.members.filter(m=>(String(m.nama_lengkap).toLowerCase().includes(q)||String(m.member_id).toLowerCase().includes(q))&&(!g||m.jenis_kelamin===g)&&(!s||m.status_hidup===s));$('memberTable').innerHTML=memberTable(items,state.user.role==='Admin');}
function openMemberForm(id=''){if(state.user.role!=='Admin')return;const m=state.members.find(x=>String(x.member_id)===String(id))||{};const field=(label,key,type='text',value=m[key]||'',extra='')=>`<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`;
$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${id?'Ubah':'Tambah'} Anggota Keluarga</h2><button class="close" onclick="closeModal()">×</button></div><form id="memberForm"><input type="hidden" name="member_id" value="${esc(m.member_id||'')}"><div class="form-grid">
${field('Nama lengkap *','nama_lengkap','text',m.nama_lengkap||'','required')}
${field('Nama panggilan','nama_panggilan')}
<div class="field"><label>Jenis kelamin</label><select name="jenis_kelamin"><option value="">Pilih</option>${['Laki-laki','Perempuan','Tidak diketahui'].map(x=>`<option ${m.jenis_kelamin===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Status</label><select name="status_hidup"><option ${!m.status_hidup||m.status_hidup==='Hidup'?'selected':''}>Hidup</option><option ${m.status_hidup==='Meninggal'?'selected':''}>Meninggal</option></select></div>
${field('Tempat lahir','tempat_lahir')}
${field('Tanggal lahir','tanggal_lahir','date',dateInput(m.tanggal_lahir))}
${field('Tanggal meninggal','tanggal_meninggal','date',dateInput(m.tanggal_meninggal))}
<div class="field"><label>Ayah</label><select name="father_id">${optionsMembers(m.father_id,m.member_id)}</select></div>
<div class="field"><label>Ibu</label><select name="mother_id">${optionsMembers(m.mother_id,m.member_id)}</select></div>
<div class="field"><label>Pasangan</label><select name="spouse_id">${optionsMembers(m.spouse_id,m.member_id)}</select></div>
<div class="field"><label>Cabang keluarga</label><select name="family_group_id">${optionsFamilies(m.family_group_id)}</select></div>
${field('Generasi (angka)','generasi','number',m.generasi||'','min="1"')}
${field('Pekerjaan','pekerjaan')}
${field('Pendidikan','pendidikan')}
${field('Telepon','telepon','tel')}
${field('Alamat','alamat')}
<div class="field full"><label>Catatan</label><textarea name="catatan" rows="2">${esc(m.catatan||'')}</textarea></div>
<div class="field full"><label>Foto anggota (opsional, maks. 3 MB)</label><input id="memberPhoto" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div id="photoHint" class="muted" style="font-size:12px">${m.photo_url?'Foto tersimpan tersedia. Pilih file baru jika ingin mengganti.':''}</div></div>
</div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button type="submit" class="btn" id="saveMemberBtn">Simpan data</button></div></form></div></div>`;
$('memberForm').addEventListener('submit',submitMember);}
function dateInput(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v).slice(0,10):d.toISOString().slice(0,10);}
function closeModal(){$('modalRoot').innerHTML='';}
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
async function submitMember(e){e.preventDefault();const form=e.currentTarget,btn=$('saveMemberBtn');btn.disabled=true;btn.textContent='Menyimpan...';try{const data=Object.fromEntries(new FormData(form).entries());const file=$('memberPhoto').files[0];if(file){if(file.size>3*1024*1024)throw new Error('Ukuran foto maksimal 3 MB.');data.photo_data=await fileToDataUrl(file);data.photo_name=file.name;}await callServer('saveMember',state.token,data);closeModal();await refreshData();toast('Data anggota berhasil disimpan.');}catch(e){toast(e.message);}finally{btn.disabled=false;btn.textContent='Simpan data';}}
async function deleteMemberUi(id){const m=state.members.find(x=>String(x.member_id)===String(id));if(!m||!confirm('Hapus anggota '+m.nama_lengkap+'? Tindakan ini tidak dapat dibatalkan.'))return;try{await callServer('deleteMember',state.token,id);await refreshData();toast('Anggota berhasil dihapus.');}catch(e){toast(e.message);}}
function renderTree(){const roots=state.members.filter(m=>!m.father_id&&!m.mother_id);const rootOptions=state.members.slice().sort((a,b)=>String(a.nama_lengkap).localeCompare(String(b.nama_lengkap))).map(m=>`<option value="${esc(m.member_id)}" ${state.treeFocus===m.member_id?'selected':''}>${esc(m.nama_lengkap)}</option>`).join('');$('content').innerHTML=pageHead('Pohon Silsilah','Pilih leluhur atau anggota untuk melihat cabang keturunannya.','<button class="btn secondary" onclick="treeZoom(-.1)">−</button><button class="btn secondary" onclick="treeZoom(.1)">＋</button><button class="btn secondary" onclick="resetTree()">Atur ulang</button><button class="btn" onclick="window.print()">Cetak diagram</button>')+`<div class="panel"><div class="panel-head"><div><h3>Diagram interaktif</h3><p class="muted" style="font-size:12px;margin:5px 0 0">Klik kartu anggota untuk memfokuskan diagram pada keturunannya.</p></div><div class="tree-tools"><label for="treeRoot" class="muted" style="font-size:12px">Titik awal</label><select id="treeRoot" onchange="focusTree(this.value)" style="padding:9px;border:1px solid var(--line);border-radius:9px;max-width:240px"><option value="">Semua leluhur utama</option>${rootOptions}</select></div></div><div class="tree-viewport"><div id="treeCanvas" class="tree-canvas" style="transform:scale(${state.treeScale})">${buildTreeMarkup()}</div></div><div class="tree-note">Diagram berdasarkan relasi ayah dan ibu. Pasangan ditampilkan pada kartu profil; diagram keturunan berpusat pada relasi orang tua-anak.</div></div>`;}
function buildTreeMarkup(){if(!state.members.length)return '<div class="empty">Tambahkan data anggota untuk mulai membentuk silsilah.</div>';let roots;if(state.treeFocus){const m=state.members.find(x=>String(x.member_id)===String(state.treeFocus));roots=m?[m]:[];}else{roots=state.members.filter(m=>!m.father_id&&!m.mother_id);if(!roots.length)roots=state.members.slice(0,1);}const unique=new Set();return `<div class="tree-level">${roots.map(m=>treeNode(m,unique,0)).join('')}</div>`;}
function treeNode(m,seen,depth){if(!m||seen.has(String(m.member_id))||depth>12)return '';seen.add(String(m.member_id));const children=state.members.filter(c=>String(c.father_id)===String(m.member_id)||String(c.mother_id)===String(m.member_id)).sort((a,b)=>String(a.nama_lengkap).localeCompare(String(b.nama_lengkap)));const gender=m.jenis_kelamin==='Perempuan'?'female':'';const photo=m.photo_url?`<img class="photo" src="${esc(m.photo_url)}" alt="">`:'<div class="photo" style="display:inline-grid;place-items:center">👤</div>';return `<div class="tree-node"><div class="node-card ${gender}" onclick="focusTree('${esc(m.member_id)}')" title="Klik untuk fokus pada keturunan">${photo}<div class="node-name">${esc(m.nama_lengkap)}</div><div class="node-sub">${esc(yearOf(m.tanggal_lahir)||'Tahun lahir tidak diketahui')} · ${esc(m.status_hidup||'Hidup')}</div><div class="node-sub">${m.spouse_id?'Pasangan: '+esc(memberName(m.spouse_id)):''}</div></div>${children.length?`<div class="tree-children">${children.map(c=>treeNode(c,seen,depth+1)).join('')}</div>`:''}</div>`;}
function focusTree(id){state.treeFocus=id||'';renderTree();}
function treeZoom(delta){state.treeScale=Math.max(.4,Math.min(1.6,state.treeScale+delta));const c=$('treeCanvas');if(c)c.style.transform=`scale(${state.treeScale})`;}
function resetTree(){state.treeFocus='';state.treeScale=1;renderTree();}
function renderFamilies(){const admin=state.user.role==='Admin';$('content').innerHTML=pageHead('Cabang Keluarga','Kelompokkan anggota berdasarkan cabang keluarga.',admin?'<button class="btn" onclick="openFamilyForm()">＋ Tambah Cabang</button>':'')+`<div class="family-grid">${state.families.length?state.families.map(f=>`<div class="family-card"><h4>${esc(f.nama_keluarga)}</h4><p>Kepala keluarga: ${esc(memberName(f.kepala_keluarga_id))}</p><p>Leluhur utama: ${esc(memberName(f.leluhur_utama_id))}</p><p>Anggota: ${state.members.filter(m=>String(m.family_group_id)===String(f.family_group_id)).length}</p><p>${esc(f.alamat||'Alamat belum diisi')}</p>${admin?`<div class="actions" style="margin-top:12px"><button class="btn secondary small" onclick="openFamilyForm('${esc(f.family_group_id)}')">Edit</button><button class="btn danger small" onclick="deleteFamilyUi('${esc(f.family_group_id)}')">Hapus</button></div>`:''}</div>`).join(''):'<div class="empty">Belum ada cabang keluarga. Tambahkan cabang untuk mengelompokkan anggota.</div>'}</div>`;}
function openFamilyForm(id=''){const f=state.families.find(x=>String(x.family_group_id)===String(id))||{};$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:600px"><div class="modal-head"><h2>${id?'Ubah':'Tambah'} Cabang Keluarga</h2><button class="close" onclick="closeModal()">×</button></div><form id="familyForm"><input type="hidden" name="family_group_id" value="${esc(f.family_group_id||'')}"><div class="field"><label>Nama keluarga/cabang *</label><input name="nama_keluarga" required value="${esc(f.nama_keluarga||'')}"></div><div class="field"><label>Kepala keluarga administratif</label><select name="kepala_keluarga_id">${optionsMembers(f.kepala_keluarga_id)}</select></div><div class="field"><label>Leluhur utama</label><select name="leluhur_utama_id">${optionsMembers(f.leluhur_utama_id)}</select></div><div class="field"><label>Alamat</label><textarea name="alamat">${esc(f.alamat||'')}</textarea></div><div class="field"><label>Keterangan</label><textarea name="keterangan">${esc(f.keterangan||'')}</textarea></div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn">Simpan</button></div></form></div></div>`;$('familyForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('saveFamily',state.token,Object.fromEntries(new FormData(e.currentTarget).entries()));closeModal();await refreshData();toast('Cabang keluarga disimpan.');}catch(err){toast(err.message);}});}
async function deleteFamilyUi(id){if(!confirm('Hapus cabang keluarga ini?'))return;try{await callServer('deleteFamily',state.token,id);await refreshData();toast('Cabang keluarga dihapus.');}catch(e){toast(e.message);}}
function renderReports(){$('content').innerHTML=pageHead('Cetak & Laporan','Cetak daftar anggota atau diagram silsilah.','<button class="btn" onclick="window.print()">Cetak halaman</button>')+`<div class="panel"><div class="panel-head"><h3>Daftar anggota keluarga</h3><span class="badge">${state.members.length} anggota</span></div>${memberTable(state.members,false)}</div><div class="panel"><h3>Petunjuk cetak</h3><p class="muted" style="font-size:13px;line-height:1.7">Gunakan tombol Cetak halaman. Untuk diagram, buka menu Pohon Silsilah terlebih dahulu lalu pilih Cetak diagram. Pada dialog cetak browser, pilih printer atau “Save as PDF”.</p></div>`;}
function renderUsers(){$('content').innerHTML=pageHead('Pengguna','Buat akun Admin atau Pengguna.','')+`<div class="panel"><h3>Tambah pengguna</h3><form id="userForm"><div class="form-grid"><div class="field"><label>Username *</label><input name="username" required minlength="3"></div><div class="field"><label>Nama tampilan</label><input name="display_name"></div><div class="field"><label>Password awal (min. 10 karakter) *</label><input name="password" type="password" required minlength="10"></div><div class="field"><label>Peran</label><select name="role"><option>Pengguna</option><option>Admin</option></select></div></div><button class="btn">Buat pengguna</button></form></div><div class="panel"><h3>Perlindungan akses</h3><p class="muted" style="font-size:13px">Pengguna yang dibuat dapat login melalui halaman login. Pengguna non-Admin hanya dapat melihat data. Pastikan deployment dibatasi sesuai kebutuhan keluarga.</p></div>`;$('userForm').addEventListener('submit',async e=>{e.preventDefault();try{await callServer('createUser',state.token,Object.fromEntries(new FormData(e.currentTarget).entries()));e.currentTarget.reset();toast('Pengguna berhasil dibuat.');}catch(err){toast(err.message);}});}
async function renderLogs(){$('content').innerHTML=pageHead('Log Aktivitas','Riwayat aktivitas terbaru administrator.','')+'<div class="panel" id="logsPanel">Memuat log...</div>';try{const logs=await callServer('getActivityLogs',state.token);$('logsPanel').innerHTML=logs.length?`<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aktivitas</th><th>Keterangan</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(l.waktu)}</td><td>${esc(l.username)}</td><td>${esc(l.aktivitas)}</td><td>${esc(l.keterangan)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada log.</div>';}catch(e){$('logsPanel').innerHTML=errBox(e.message);}}
function renderPassword(){$('content').innerHTML=pageHead('Ganti Password','Gunakan password unik yang sulit ditebak.','')+`<div class="panel" style="max-width:650px"><form id="passwordForm"><div class="field"><label>Password lama</label><input name="oldPassword" type="password" required></div><div class="field"><label>Password baru (minimal 10 karakter)</label><input name="newPassword" type="password" minlength="10" required></div><div class="field"><label>Ulangi password baru</label><input name="confirmPassword" type="password" minlength="10" required></div><button class="btn">Ubah password</button></form></div>`;$('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget).entries());if(d.newPassword!==d.confirmPassword)return toast('Konfirmasi password tidak sama.');try{await callServer('changePassword',state.token,d.oldPassword,d.newPassword);e.currentTarget.reset();toast('Password berhasil diubah.');}catch(err){toast(err.message);}});}
</script>
</body>
</html>
